name: Build all platforms

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      should_build: 'true'
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current_full="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          if [[ ! "$current_full" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "Invalid pubspec version: $current_full"
            exit 1
          fi

          version="${current_full%%+*}"
          build_number="${current_full##*+}"
          
          # Si fue disparado por release, usar el tag del release
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag_name="${{ github.event.release.tag_name }}"
          else
            tag_name="v$version"
          fi

          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "release_tag=$tag_name"
          } >> "$GITHUB_OUTPUT"

          echo "Current version: $current_full"
          echo "Release tag: $tag_name"

  validate:
    name: Analyze project
    needs: detect-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create environment file
        shell: bash
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [[ -n "$ENV_FILE_CONTENT" ]]; then
            printf '%s' "$ENV_FILE_CONTENT" > .env
          else
            printf '%s\n' 'API_URL=https://emusic.joss.red' > .env
          fi
      - run: flutter pub get
      - run: dart analyze lib

  android:
    name: Android
    needs: [detect-version, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create environment file
        shell: bash
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [[ -n "$ENV_FILE_CONTENT" ]]; then printf '%s' "$ENV_FILE_CONTENT" > .env; else printf '%s\n' 'API_URL=https://emusic.joss.red' > .env; fi
      - name: Configure Firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
      - name: Configure Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/jossestrada.keystore
            store_password="$KEYSTORE_PASSWORD"
            key_alias="$KEY_ALIAS"
            key_password="$KEY_PASSWORD"
          else
            keytool -genkeypair -keystore android/app/jossestrada.keystore -alias jossestrada -keyalg RSA -keysize 2048 -validity 10000 -storepass testpassword -keypass testpassword -dname 'CN=Estrella Music, O=JOSPROX, C=MX'
            store_password=testpassword
            key_alias=jossestrada
            key_password=testpassword
          fi
          {
            echo 'storeFile=jossestrada.keystore'
            echo "storePassword=$store_password"
            echo "keyAlias=$key_alias"
            echo "keyPassword=$key_password"
          } > android/key.properties
      - run: flutter pub get
      - name: Build Android packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p distribution/android
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/*-release.apk distribution/android/
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk distribution/android/EstrellaMusic-android-universal.apk
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab distribution/android/EstrellaMusic-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: estrella-music-android-${{ needs.detect-version.outputs.version }}-${{ needs.detect-version.outputs.build_number }}
          path: distribution/android/*
          if-no-files-found: error

  linux:
    name: Linux
    needs: [detect-version, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjson-glib-dev libayatana-appindicator3-dev libmpv-dev mpv flatpak flatpak-builder
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create environment file
        shell: bash
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [[ -n "$ENV_FILE_CONTENT" ]]; then printf '%s' "$ENV_FILE_CONTENT" > .env; else printf '%s\n' 'API_URL=https://emusic.joss.red' > .env; fi
      - run: flutter pub get
      - name: Build Linux application
        run: flutter build linux --release
      - name: Package Linux application (Tarball & Flatpak)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p distribution/linux
          tar -czf distribution/linux/EstrellaMusic-linux-x64.tar.gz -C build/linux/x64/release/bundle .
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//46 org.gnome.Sdk//46
          cd distribution/flatpak
          flatpak-builder --force-clean --repo=repo build-dir com.josprox.EstrellaMusic.yml
          flatpak build-bundle repo EstrellaMusic-linux-x64.flatpak com.josprox.EstrellaMusic
          mv EstrellaMusic-linux-x64.flatpak ../linux/

      - uses: actions/upload-artifact@v4
        with:
          name: estrella-music-linux-${{ needs.detect-version.outputs.version }}-${{ needs.detect-version.outputs.build_number }}
          path: distribution/linux/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: [detect-version, validate]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create environment file
        shell: bash
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [[ -n "$ENV_FILE_CONTENT" ]]; then printf '%s' "$ENV_FILE_CONTENT" > .env; else printf '%s\n' 'API_URL=https://emusic.joss.red' > .env; fi
      - run: flutter pub get
      - name: Build Windows application
        run: flutter build windows --release
      - name: Package Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path distribution/windows | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DMyAppVersion="${{ needs.detect-version.outputs.version }}" 'distribution/compilador.iss'
          $installer = Get-Item distribution/EstrellaMusic*.exe | Select-Object -First 1
          Move-Item -Force $installer.FullName 'distribution/windows/EstrellaMusic-windows-installer.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: estrella-music-windows-${{ needs.detect-version.outputs.version }}-${{ needs.detect-version.outputs.build_number }}
          path: distribution/windows/*
          if-no-files-found: error

  apple:
    name: iOS & macOS
    needs: [detect-version, validate]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use CocoaPods integration
        run: flutter config --no-enable-swift-package-manager
      - name: Create environment file
        shell: bash
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [[ -n "$ENV_FILE_CONTENT" ]]; then printf '%s' "$ENV_FILE_CONTENT" > .env; else printf '%s\n' 'API_URL=https://emusic.joss.red' > .env; fi
      - run: flutter pub get
      - name: Patch audiotags podspec
        shell: bash
        run: find ~/.pub-cache -name 'audiotags.podspec' -exec perl -pi -e 's/if \[ ! -d ios.zip \]d/if [ ! -f ios.zip ]/g' {} +
      - name: Install iOS and macOS pods
        shell: bash
        run: |
          (cd ios && pod install --repo-update)
          (cd macos && pod install --repo-update)
      - name: Build unsigned iOS application
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p distribution/apple/ios/Payload
          cp -R build/ios/iphoneos/Runner.app distribution/apple/ios/Payload/
          (cd distribution/apple/ios && zip -qry ../EstrellaMusic-ios-unsigned.ipa Payload)
          rm -rf distribution/apple/ios
      - name: Build macOS application
        run: flutter build macos --release
      - name: Package macOS application
        shell: bash
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" distribution/apple/EstrellaMusic-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: estrella-music-apple-${{ needs.detect-version.outputs.version }}-${{ needs.detect-version.outputs.build_number }}
          path: distribution/apple/*
          if-no-files-found: error

  upload-assets:
    name: Upload assets to release
    needs: [detect-version, android, linux, windows, apple]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      
      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.release_tag }}
          draft: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
