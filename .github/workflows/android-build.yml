name: Build Android APK & App Bundle

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "API_URL=https://emusic.josprox.com" > .env
          else
            echo "${{ secrets.ENV_FILE }}" > .env
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Firebase Config (Google Services)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "Decoding google-services.json..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          else
            echo "No custom google-services.json secret found. Using dummy configuration..."
            echo '{"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:abc123def456","android_client_info":{"package_name":"com.josprox.emusic"}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::$secret_name is required. Temporary signing keys are forbidden."
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/jossestrada.keystore
          signing_sha256=$(keytool -list -v \
            -keystore android/app/jossestrada.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          expected_sha256='DBF27FF8DB0F765CC1FC0762B37557AFFA53378AC14020E2FB588140B0A61945'
          if [ "$signing_sha256" != "$expected_sha256" ]; then
            echo "::error::KEYSTORE_BASE64 does not contain the Estrella Music release certificate."
            exit 1
          fi

          {
            echo "storeFile=jossestrada.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build Split APKs
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p build-artifacts
          cp build/app/outputs/flutter-apk/*-release.apk build-artifacts/

      - name: Build Universal APK
        run: |
          flutter clean
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build-artifacts/

      - name: Build App Bundle (AAB)
        run: |
          flutter clean
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab build-artifacts/

      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-split-apks
          path: build-artifacts/*-release.apk

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: android-universal-apk
          path: build-artifacts/app-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: build-artifacts/app-release.aab

      - name: Upload binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/*-release.apk
            build-artifacts/app-release.apk
            build-artifacts/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
