name: Build iOS IPA (Sideload/Testing)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "API_URL=https://emusic.josprox.com" > .env
          else
            echo "${{ secrets.ENV_FILE }}" > .env
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean and Install dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get

      - name: Patch audiotags podspec typo
        run: |
          find ~/.pub-cache -name "audiotags.podspec" -exec perl -pi -e 's/if \[ ! -d ios.zip \]d/if [ ! -f ios.zip ]/g' {} +

      - name: Configure CocoaPods Environment
        run: |
          cd ios
          pod repo update
          pod install

      - name: Disable Code Signing in Xcode Project
        run: |
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "DEAD_CODE_STRIPPING=NO" >> ios/Flutter/Release.xcconfig
          echo "STRIP_STYLE=non-global" >> ios/Flutter/Release.xcconfig
          
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Debug.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Debug.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Debug.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY=" >> ios/Flutter/Debug.xcconfig
          echo "DEAD_CODE_STRIPPING=NO" >> ios/Flutter/Debug.xcconfig
          echo "STRIP_STYLE=non-global" >> ios/Flutter/Debug.xcconfig

      - name: Build iOS Application (Runner.app)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA format
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r EstrellaMusic.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-sideload-ipa
          path: EstrellaMusic.ipa
          retention-days: 5

      - name: Upload binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EstrellaMusic.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}