name: Build iOS IPA para BrowserStack

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Crear archivo .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Desactivar Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Borrar dependencias y limpiar caché
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          flutter pub get

      - name: Construir aplicación iOS (Simulador)
        # Aquí está el truco: Compilamos para simulador de iOS. 
        # Esto evade el bloqueo de "Development Team" de Xcode.
        run: flutter build ios --simulator

      - name: Empaquetar a formato .ipa
        # Extraemos la App del simulador y la empaquetamos
        run: |
          mkdir -p Payload
          # La ruta cambia al compilar para simulador
          mv build/ios/iphonesimulator/Runner.app Payload
          zip -r app.ipa Payload

      - name: Subir artefacto para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: app.ipa
          retention-days: 5