name: Build iOS IPA para BrowserStack

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Crear archivo .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Borrar dependencias y limpiar caché
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          flutter pub get

      - name: Construir base de Flutter (Dispositivo Físico)
        # Preparamos los frameworks nativos. Si falla la firma al final, lo ignoramos con "|| true"
        run: flutter build ios --release --no-codesign || true

      - name: Forzar compilación global sin firmas (Xcode Hack)
        # Obligamos a Xcode a ignorar el Development Team en TODOS los targets (incluido OneSignal)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY="" build SYMROOT="${PWD}/../build/ios"

      - name: Empaquetar a formato .ipa
        # Buscamos dinámicamente la app resultante, la metemos en Payload y la zipeamos
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          mv "$APP_PATH" Payload/
          zip -r app.ipa Payload

      - name: Subir artefacto para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: app.ipa
          retention-days: 5