name: Build iOS IPA para BrowserStack

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Crear archivo .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Desactivar Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Borrar dependencias y limpiar caché
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          flutter pub get

      - name: Forzar desactivación de firma en Xcode
        # Inyecta variables al archivo de configuración de iOS para neutralizar la exigencia de un Development Team
        run: |
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=\"\"" >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY=\"\"" >> ios/Flutter/Release.xcconfig

      - name: Construir aplicación iOS (Sin certificados)
        run: flutter build ios --release --no-codesign

      - name: Empaquetar a formato .ipa
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -r app.ipa Payload

      - name: Subir artefacto para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: app.ipa
          retention-days: 5