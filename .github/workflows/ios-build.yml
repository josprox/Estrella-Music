name: Build iOS IPA para BrowserStack

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Crear archivo .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Desactivar Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Borrar dependencias y limpiar caché
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          flutter pub get

      - name: Inyectar parche anti-firmas en Podfile
        # Escribe un script Ruby temporal que modifica el Podfile. 
        # Esto desactiva el requerimiento de certificados de Apple en todos los módulos (incluido OneSignal).
        run: |
          cat << 'EOF' > patch.rb
          lines = File.readlines('ios/Podfile')
          File.open('ios/Podfile', 'w') do |f|
            lines.each do |l|
              f.puts l
              if l.include?('post_install do |installer|')
                f.puts "    installer.pods_project.targets.each do |target|"
                f.puts "      target.build_configurations.each do |config|"
                f.puts "        config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'"
                f.puts "        config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'"
                f.puts "        config.build_settings['CODE_SIGN_IDENTITY'] = ''"
                f.puts "        config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''"
                f.puts "      end"
                f.puts "    end"
                f.puts "    require 'xcodeproj'"
                f.puts "    project_path = File.join(Dir.pwd, '..', 'Runner.xcodeproj')"
                f.puts "    project = Xcodeproj::Project.open(project_path)"
                f.puts "    project.targets.each do |target|"
                f.puts "      target.build_configurations.each do |config|"
                f.puts "        config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'"
                f.puts "        config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'"
                f.puts "        config.build_settings['CODE_SIGN_IDENTITY'] = ''"
                f.puts "        config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''"
                f.puts "      end"
                f.puts "    end"
                f.puts "    project.save"
              end
            end
          end
          EOF
          ruby patch.rb
          rm patch.rb

      - name: Construir aplicación iOS (Físico)
        # Flutter compilará correctamente porque el Podfile parchado ya silenció a Xcode
        run: flutter build ios --release --no-codesign

      - name: Empaquetar a formato .ipa
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -r app.ipa Payload

      - name: Subir artefacto para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: app.ipa
          retention-days: 5